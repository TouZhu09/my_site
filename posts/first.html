<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开篇：博客启程 | 投杼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #121212;
            --text: #e6e6e6;
            --muted: #aaa;
            --accent: #72a0d8;
            --border: #333;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            max-width:720px;
            margin:0 auto;
            padding:0 20px;
        }
        header{
            padding:40px 0 20px;
            border-bottom:1px solid var(--border);
        }
        header a{
            color:var(--accent);
            text-decoration:none;
        }
        h1{
            margin:20px 0 8px;
        }
        .date{
            color:var(--muted);
            margin-bottom:32px;
        }
        article p{
            margin-bottom:18px;
        }
        footer{
            margin-top:60px;
            padding:24px 0;
            border-top:1px solid var(--border);
            color:var(--muted);
            font-size:0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="/">← 返回投杼主页</a>
    </header>
    <article>
        <h1>开篇：博客启程</h1>
        <div class="date">2026-10-18</div>
        <p>人生中第一个属于自己的网站</p>
        <p></p>
        <p></p>
    </article>
    <footer>© 2026 投杼</footer>
</body>
</html>
